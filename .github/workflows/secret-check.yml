name: 秘密情報の検査
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 公式Actionを変更できないコミット番号で固定。認証情報を作業フォルダに残さない。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 作業ファイルと全履歴を検査
        run: |
          node scripts/check-secrets.mjs
          node scripts/check-secrets.mjs --history
